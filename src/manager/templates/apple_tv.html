<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple TV Steuerung</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #9147ff; }
        .stream-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
        }
        .stream-name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        .stream-url { font-size: 0.85em; color: #aaa; margin-bottom: 15px; word-break: break-all; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #9147ff;
            color: white;
        }
        .btn-primary:hover { background: #772ce8; }
        .btn-success {
            background: #4caf50;
            color: white;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        .status.show { display: block; }
        .status.success { background: #1b5e20; }
        .status.error { background: #b71c1c; }
        .no-streams {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        .tv-config {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .tv-config input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #0f3460;
            background: #16213e;
            color: #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 Apple TV Steuerung</h1>
        
        <div class="tv-config">
            <input type="text" id="tvIp" placeholder="Apple TV IP" value="192.168.25.20">
        </div>

        {% if streams %}
            {% for stream in streams %}
            <div class="stream-card">
                <div class="stream-name">📺 {{ stream.display_name or stream.channel }}</div>
                <div class="stream-url">http://{{ host_ip }}:{{ stream.port }}/{{ stream.channel }}</div>
                <button class="btn btn-primary" onclick="sendToAppleTv('http://{{ host_ip }}:{{ stream.port }}/{{ stream.channel }}')">
                    ▶️ Auf Apple TV senden
                </button>
            </div>
            {% endfor %}
        {% else %}
            <div class="no-streams">
                <p>Keine aktiven Streams</p>
                <p style="margin-top:10px; font-size:0.9em;">Starte erst einen Stream im Hauptmenü</p>
            </div>
        {% endif %}

        <div id="status" class="status"></div>
    </div>

    <script>
        async function sendToAppleTv(streamUrl) {
            const tvIp = document.getElementById('tvIp').value;
            const status = document.getElementById('status');
            
            status.className = 'status show';
            status.textContent = 'Sende...';
            status.style.background = '#0f3460';
            
            try {
                const response = await fetch('/send-to-apple-tv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tv_ip: tvIp, stream_url: streamUrl })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.className = 'status show success';
                    status.textContent = '✅ ' + (data.message || 'Gesendet!');
                } else {
                    status.className = 'status show error';
                    status.textContent = '❌ ' + (data.error || 'Fehler');
                }
            } catch (e) {
                status.className = 'status show error';
                status.textContent = '❌ Netzwerkfehler: ' + e.message;
            }
            
            setTimeout(() => status.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
