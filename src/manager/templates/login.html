<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Anmeldung – Stream Connect</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f5f5f5; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { width: min(100%, 380px); padding: 28px; background: white; border-radius: 12px; box-shadow: 0 4px 18px #0002; }
    h1 { margin: 0 0 8px; font-size: 23px; } p { color: #666; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; }
    button { width: 100%; margin-top: 22px; padding: 12px; color: white; background: #9146ff; border: 0; border-radius: 7px; font-size: 16px; cursor: pointer; }
    .error { padding: 10px; color: #a22; background: #fff0f0; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Stream Connect</h1>
    <p>Bitte melde dich an, um den Manager zu öffnen.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Benutzername</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
    </form>
  </main>
</body>
</html>
