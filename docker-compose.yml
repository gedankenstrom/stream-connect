version: "3.8"

services:
  stream-connect:
    image: ghcr.io/gedankenstrom/stream-connect:latest
    container_name: stream-connect
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST_IP=${HOST_IP:-auto}
      - DATA_DIR=/data
      - AUTH_USERNAME=${AUTH_USERNAME:?Set AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?Set AUTH_PASSWORD in Portainer}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a random secret}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    volumes:
      - stream-connect-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  stream-connect-data:
