version: "3.8"

services:
  twitch-manager:
    image: ghcr.io/gedankenstrom/twitch-manager:latest
    container_name: twitch_manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST_IP=${HOST_IP:-auto}
      - DATA_DIR=/data
    volumes:
      - twitch-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  twitch-data:
