version: "3.8"

services:
  stream-connect:
    image: ghcr.io/gedankenstrom/stream-connect:latest
    container_name: stream-connect
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST_IP=auto
      - DATA_DIR=/data
      - AUTH_USERNAME=${AUTH_USERNAME:?Set AUTH_USERNAME in Portainer}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in Portainer}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in Portainer}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    volumes:
      - stream-connect-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  stream-connect-data:
